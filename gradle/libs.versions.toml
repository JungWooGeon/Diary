[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
hilt = "2.60.1"
androidxHilt = "1.4.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
playAppUpdate = "2.1.0"

[libraries]
androidx-core-ktx = "androidx.core:core-ktx:1.19.1"
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-core-splashscreen = "androidx.core:core-splashscreen:1.2.0"
androidx-fragment = "androidx.fragment:fragment-ktx:1.8.9"
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = "androidx.datastore:datastore-preferences:1.3.0"
androidx-exifinterface = "androidx.exifinterface:exifinterface:1.4.1"
androidx-biometric = "androidx.biometric:biometric:1.1.0"
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
kotlinx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
kotlinx-coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
coil-compose = "io.coil-kt.coil3:coil-compose:3.6.3"
play-app-update = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "playAppUpdate" }
work-runtime = "androidx.work:work-runtime-ktx:2.12.0"
androidx-glance-appwidget = "androidx.glance:glance-appwidget:1.2.0"
okhttp = "com.squareup.okhttp3:okhttp:5.5.1"
androidx-credentials = "androidx.credentials:credentials:1.6.0"
androidx-credentials-play-services = "androidx.credentials:credentials-play-services-auth:1.6.0"
googleid = "com.google.android.libraries.identity.googleid:googleid:1.2.1"
play-services-auth = "com.google.android.gms:play-services-auth:22.0.0"
robolectric = "org.robolectric:robolectric:4.18.1"
litert = "com.google.ai.edge.litert:litert:1.4.2"
litertlm-android = "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
junit = "junit:junit:4.13.2"
play-services-ads = "com.google.android.gms:play-services-ads:25.5.0"
ump = "com.google.android.ump:user-messaging-platform:4.0.0"
billing = "com.android.billingclient:billing-ktx:9.1.0"

# Gradle plugins, as build-logic dependencies
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
